services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: route_optimizer
      POSTGRES_USER: route_optimizer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U route_optimizer -d route_optimizer"]
      interval: 5s
      timeout: 5s
      retries: 10

  api1:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ROUTE_OPTIMIZER_INSTANCE: api1
    depends_on:
      postgres:
        condition: service_healthy

  api2:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ROUTE_OPTIMIZER_INSTANCE: api2
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api1
      - api2

volumes:
  postgres_data:
