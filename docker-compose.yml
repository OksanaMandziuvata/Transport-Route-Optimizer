services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: route_optimizer
      POSTGRES_USER: route_optimizer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U route_optimizer -d route_optimizer"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=route_optimizer;Username=route_optimizer;Password=${POSTGRES_PASSWORD:-local_dev_password}
      Jwt__Issuer: RouteOptimizer
      Jwt__Audience: RouteOptimizer.Client
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in the environment or .env file}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api1:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ROUTE_OPTIMIZER_INSTANCE: api1
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=route_optimizer;Username=route_optimizer;Password=${POSTGRES_PASSWORD:-local_dev_password}
      Jwt__Issuer: RouteOptimizer
      Jwt__Audience: RouteOptimizer.Client
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in the environment or .env file}
    depends_on:
      migrate:
        condition: service_completed_successfully

  api2:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ROUTE_OPTIMIZER_INSTANCE: api2
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=route_optimizer;Username=route_optimizer;Password=${POSTGRES_PASSWORD:-local_dev_password}
      Jwt__Issuer: RouteOptimizer
      Jwt__Audience: RouteOptimizer.Client
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in the environment or .env file}
    depends_on:
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api1
      - api2

volumes:
  postgres_data:
